<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تواصل معنا - مشروع صقر</title>
    <style>
        body { background-color: #0b1120; color: #ffffff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; border-bottom: 1px solid #1e293b; }
        nav a { color: #94a3b8; text-decoration: none; margin: 0 15px; }
        nav a:hover, nav a.active { color: #38bdf8; }
        .container { max-width: 600px; margin: 50px auto; padding: 20px; background-color: #111c33; border: 1px solid #1e293b; border-radius: 12px; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e1; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; background-color: #0b1120; border: 1px solid #1e293b; border-radius: 8px; color: #fff; box-sizing: border-box; }
        button { background-color: #0284c7; color: white; padding: 12px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><b>SAQR | صقر</b></div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="about.html">عن النظام</a>
            <a href="awareness.html">التوعية الأمنية</a>
            <a href="testimonials.html">آراء المستخدمين</a>
            <a href="contact.html" class="active">تواصل معنا</a>
            <a href="team.html">فريق العمل</a>
        </nav>
    </header>

    <div class="container">
        <h1>تواصل مع فريق المشروع</h1>
        <form>
            <label>الاسم الكريم:</label>
            <input type="text" placeholder="أدخل اسمك هنا..." required>

            <label>البريد الإلكتروني:</label>
            <input type="email" placeholder="example@domain.com" required>

            <label>رسالتك أو استفسارك:</label>
            <textarea rows="5" placeholder="اكتب رسالتك هنا..." required></textarea>

            <button type="submit">إرسال الرسالة</button>
        </form>
    </div>

</body>
</html>
