<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع صقر | SAQR - تواصل معنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080f25;
            --card-bg: #111b38;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(8, 15, 37, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-img {
            height: 110px; 
            width: auto;  
        }

        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--accent-color);
        }

        nav ul li a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        .hero-title {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 700;
            text-align: center;
        }

        .hero-title span {
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin-bottom: 35px;
            text-align: center;
            line-height: 1.7;
        }

        .form-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(8, 15, 37, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: rgba(8, 15, 37, 0.5);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="شعار صقر" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">عن النظام</a></li>
                <li><a href="awareness.html">التوعية الأمنية</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
                <li><a href="team.html">فريق العمل</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="hero-title">تواصل مع <span>فريق صقر</span></h1>
        <p class="hero-subtitle">يسعدنا استقبال استفساراتكم وملاحظاتكم حول النظام.</p>

        <div class="form-container">
            <form id="contactForm">
                <div class="form-group">
                    <label>الاسم</label>
                    <input type="text" class="form-control" placeholder="أدخل اسمك الكريم" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" class="form-control" placeholder="example@domain.com" required>
                </div>
                <div class="form-group">
                    <label>الرسالة</label>
                    <textarea class="form-control" placeholder="اكتب رسالتك هنا..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">إرسال الرسالة</button>
            </form>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - مشروع تخرج صقر (SAQR)</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const nameInput = document.querySelector('input[type="text"]');
            const emailInput = document.querySelector('input[type="email"]');
            const messageInput = document.querySelector('textarea');

            const contactData = {
                name: nameInput.value,
                email: emailInput.value,
                message: messageInput.value,
                date: new Date().toLocaleString()
            };

            let messagesList = JSON.parse(localStorage.getItem('saqr_messages')) || [];
            messagesList.push(contactData);
            localStorage.setItem('saqr_messages', JSON.stringify(messagesList));

            alert('تم إرسال رسالتك وحفظها بنجاح!');
            this.reset();
        });
    </script>
</body>
</html>
