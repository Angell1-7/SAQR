<html lang="ar" dir="rtl">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080f25;
            --card-bg: #111b38;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --success-color: #10b981;
            --warning-color: #facc15;
            --danger-color: #ef4444;
            --orange-color: #fb923c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(8, 15, 37, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-img {
            height: 110px; 
            width: auto;  
        }

        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--accent-color);
        }

        nav ul li a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            text-align: center;
        }

        .hero-title {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .hero-title span {
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 650px;
            margin-bottom: 40px;
            line-height: 1.7;
        }

        .upload-container {
            background-color: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            padding: 45px 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-container:hover {
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.1);
        }

        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .upload-text {
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 1.05rem;
        }
