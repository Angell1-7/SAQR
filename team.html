<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فريق العمل | مشروع صقر (SAQR)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080f25;
            --card-bg: #111b38;
            --accent-color: #38bdf8;
            --leader-color: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; animation: fadeIn 0.8s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 8%; border-bottom: 1px solid var(--border-color);
            background-color: rgba(8, 15, 37, 0.9); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-img {
            height: 110px; 
            width: auto;
        }

        nav ul { display: flex; gap: 25px; list-style: none; }
        nav ul li a { color: var(--text-muted); text-decoration: none; font-weight: 600; transition: color 0.3s; position: relative; padding-bottom: 5px; }
        nav ul li a:hover, nav ul li a.active { color: var(--accent-color); }
        nav ul li a.active::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 100%; height: 2px; background-color: var(--accent-color);
        }

        main { flex: 1; padding: 60px 8%; max-width: 1200px; margin: 0 auto; text-align: center; }
        h1 { font-size: 2.3rem; margin-bottom: 10px; color: var(--accent-color); font-weight: 700; }
        .subtitle { color: var(--text-muted); margin-bottom: 45px; font-size: 1.1rem; }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            text-align: right;
        }
    
        .team-card {
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color);
            border-radius: 18px; 
            padding: 25px; 
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
        }
        .team-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.15);
        }

        .team-card.leader {
            border-color: var(--border-color);
            background: linear-gradient(135deg, #111b38 0%, #0c1830 100%);
        }
        .team-card.leader:hover {
            border-color: var(--accent-color);
        }
        .leader-badge {
            display: inline-block;
            background-color: var(--leader-color);
            color: #080f25;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
            width: fit-content;
        }

        .card-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 15px;
        }
        .avatar {
            width: 50px; height: 50px; background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color); font-size: 1.4rem; display: flex;
            align-items: center; justify-content: center; border-radius: 50%;
            border: 2px solid var(--accent-color); flex-shrink: 0;
        }
        .team-card.leader .avatar {
            background: rgba(245, 158, 11, 0.1);
            color: var(--leader-color);
            border-color: var(--leader-color);
        }
